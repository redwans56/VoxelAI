<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="560">
  <defs>
    <linearGradient id="bgDash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="barEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="barAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="radarFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="960" height="560" rx="12" fill="url(#bgDash)" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <rect x="0" y="0" width="960" height="48" rx="12" fill="#0f172a" />
  <circle cx="24" cy="24" r="6" fill="#ef4444" />
  <circle cx="44" cy="24" r="6" fill="#f59e0b" />
  <circle cx="64" cy="24" r="6" fill="#10b981" />
  <text x="96" y="29" font-family="'Segoe UI', monospace" font-size="14" font-weight="bold" fill="#38bdf8">VOXEL AI // AGENT TELEMETRY &amp; NEUROANALYTICS (KEY: 'O')</text>
  <text x="820" y="29" font-family="'Segoe UI', monospace" font-size="12" fill="#64748b">POPULATION: 10 ALIVE</text>

  <!-- Left Column: Agent Profile & 12-Gene Radar -->
  <g transform="translate(30, 70)">
    <!-- Card Panel -->
    <rect width="430" height="460" rx="8" fill="#0b1120" stroke="#1e293b" />
    <text x="20" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">AGENT #4 // KAI-14</text>
    <text x="20" y="52" font-family="'Segoe UI', monospace" font-size="12" fill="#34d399">GENERATION 1 • FITNESS: 709 • AGE: 274s</text>
    <text x="20" y="70" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">DOING: <tspan fill="#38bdf8" font-weight="bold">MINE_ORE</tspan> • HEALTH: 100% • INVENTORY: 18/64</text>

    <!-- Radar Chart (12-gene circle) -->
    <g transform="translate(215, 260)">
      <!-- Concentric Grid -->
      <circle r="30" fill="none" stroke="#1e293b" stroke-width="1" />
      <circle r="60" fill="none" stroke="#1e293b" stroke-width="1" />
      <circle r="90" fill="none" stroke="#1e293b" stroke-width="1" />
      <circle r="120" fill="none" stroke="#334155" stroke-width="1.5" />

      <!-- Axes -->
      <line x1="0" y1="-120" x2="0" y2="120" stroke="#1e293b" />
      <line x1="-120" y1="0" x2="120" y2="0" stroke="#1e293b" />
      <line x1="-85" y1="-85" x2="85" y2="85" stroke="#1e293b" />
      <line x1="-85" y1="85" x2="85" y2="-85" stroke="#1e293b" />

      <!-- Genetic Polygon -->
      <polygon points="0,-95 45,-75 80,-30 110,20 70,75 20,85 -35,90 -80,50 -95,-10 -65,-60 -30,-80 -10,-90" fill="url(#radarFill)" stroke="#38bdf8" stroke-width="2.5" />
      
      <!-- Nodes on radar -->
      <circle cx="0" cy="-95" r="4" fill="#38bdf8" />
      <circle cx="45" cy="-75" r="4" fill="#38bdf8" />
      <circle cx="80" cy="-30" r="4" fill="#38bdf8" />
      <circle cx="110" cy="20" r="4" fill="#38bdf8" />
      <circle cx="70" cy="75" r="4" fill="#38bdf8" />
      <circle cx="20" cy="85" r="4" fill="#38bdf8" />
      <circle cx="-35" cy="90" r="4" fill="#38bdf8" />
      <circle cx="-80" cy="50" r="4" fill="#38bdf8" />
      <circle cx="-95" cy="-10" r="4" fill="#38bdf8" />
      <circle cx="-65" cy="-60" r="4" fill="#38bdf8" />

      <!-- Gene Labels -->
      <text x="0" y="-128" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Aggression</text>
      <text x="125" y="-30" text-anchor="start" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Curiosity</text>
      <text x="100" y="80" text-anchor="start" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Sociability</text>
      <text x="0" y="136" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Greed</text>
      <text x="-125" y="60" text-anchor="end" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Caution</text>
      <text x="-125" y="-20" text-anchor="end" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Grit</text>
      <text x="-80" y="-85" text-anchor="end" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Architect</text>
    </g>
    <text x="215" y="440" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#64748b">12-GENE EVOLUTIONARY TRAIT PROFILE</text>
  </g>

  <!-- Right Column: Skills & Q-Value Decision Scores -->
  <g transform="translate(480, 70)">
    <!-- Skills Card -->
    <rect width="450" height="220" rx="8" fill="#0b1120" stroke="#1e293b" />
    <text x="20" y="28" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">REINFORCEMENT LEARNING SKILL MATRIX</text>
    
    <!-- Skill 1: Mining -->
    <text x="20" y="58" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">Mining Skill</text>
    <rect x="140" y="48" width="230" height="12" rx="3" fill="#1e293b" />
    <rect x="140" y="48" width="188" height="12" rx="3" fill="url(#barCyan)" />
    <text x="380" y="58" font-family="'Segoe UI', monospace" font-size="11" fill="#38bdf8">82%</text>

    <!-- Skill 2: Building -->
    <text x="20" y="86" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">Building Skill</text>
    <rect x="140" y="76" width="230" height="12" rx="3" fill="#1e293b" />
    <rect x="140" y="76" width="155" height="12" rx="3" fill="url(#barEmerald)" />
    <text x="380" y="86" font-family="'Segoe UI', monospace" font-size="11" fill="#34d399">67%</text>

    <!-- Skill 3: Navigation -->
    <text x="20" y="114" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">Navigation</text>
    <rect x="140" y="104" width="230" height="12" rx="3" fill="#1e293b" />
    <rect x="140" y="104" width="210" height="12" rx="3" fill="url(#barCyan)" />
    <text x="380" y="114" font-family="'Segoe UI', monospace" font-size="11" fill="#38bdf8">91%</text>

    <!-- Skill 4: Combat -->
    <text x="20" y="142" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">Combat</text>
    <rect x="140" y="132" width="230" height="12" rx="3" fill="#1e293b" />
    <rect x="140" y="132" width="95" height="12" rx="3" fill="url(#barAmber)" />
    <text x="380" y="142" font-family="'Segoe UI', monospace" font-size="11" fill="#fbbf24">41%</text>

    <!-- Skill 5: Survival -->
    <text x="20" y="170" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">Survival</text>
    <rect x="140" y="160" width="230" height="12" rx="3" fill="#1e293b" />
    <rect x="140" y="160" width="195" height="12" rx="3" fill="url(#barEmerald)" />
    <text x="380" y="170" font-family="'Segoe UI', monospace" font-size="11" fill="#34d399">85%</text>

    <!-- Q-Values Card -->
    <g transform="translate(0, 240)">
      <rect width="450" height="220" rx="8" fill="#0b1120" stroke="#1e293b" />
      <text x="20" y="28" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Q-VALUE ACTION POLICY SCORES</text>

      <text x="20" y="60" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">Act.MineBlock</text>
      <rect x="140" y="50" width="230" height="12" rx="3" fill="#1e293b" />
      <rect x="140" y="50" width="205" height="12" rx="3" fill="url(#barCyan)" />
      <text x="380" y="60" font-family="'Segoe UI', monospace" font-size="11" fill="#38bdf8">Q=5.24</text>

      <text x="20" y="90" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">Act.Explore</text>
      <rect x="140" y="80" width="230" height="12" rx="3" fill="#1e293b" />
      <rect x="140" y="80" width="170" height="12" rx="3" fill="url(#barCyan)" />
      <text x="380" y="90" font-family="'Segoe UI', monospace" font-size="11" fill="#38bdf8">Q=3.85</text>

      <text x="20" y="120" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">Act.BuildShelter</text>
      <rect x="140" y="110" width="230" height="12" rx="3" fill="#1e293b" />
      <rect x="140" y="110" width="135" height="12" rx="3" fill="url(#barEmerald)" />
      <text x="380" y="120" font-family="'Segoe UI', monospace" font-size="11" fill="#34d399">Q=2.91</text>

      <text x="20" y="150" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">Act.FleeLava</text>
      <rect x="140" y="140" width="230" height="12" rx="3" fill="#1e293b" />
      <rect x="140" y="140" width="220" height="12" rx="3" fill="url(#barAmber)" />
      <text x="380" y="150" font-family="'Segoe UI', monospace" font-size="11" fill="#fbbf24">Q=8.40</text>

      <text x="20" y="180" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">Act.Socialize</text>
      <rect x="140" y="170" width="230" height="12" rx="3" fill="#1e293b" />
      <rect x="140" y="170" width="70" height="12" rx="3" fill="url(#barEmerald)" />
      <text x="380" y="180" font-family="'Segoe UI', monospace" font-size="11" fill="#34d399">Q=1.22</text>
    </g>
  </g>
</svg>
