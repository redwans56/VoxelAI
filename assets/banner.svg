<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)" />
  <g stroke="#1f2937" stroke-width="1" opacity="0.4">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Isometric Voxel Cube 1 -->
  <g transform="translate(180, 140)">
    <!-- Top Face -->
    <polygon points="0,-40 50,-15 0,10 -50,-15" fill="#38bdf8" opacity="0.9" />
    <!-- Left Face -->
    <polygon points="-50,-15 0,10 0,70 -50,45" fill="#0284c7" opacity="0.95" />
    <!-- Right Face -->
    <polygon points="0,10 50,-15 50,45 0,70" fill="#0369a1" />
  </g>

  <!-- Isometric Voxel Cube 2 -->
  <g transform="translate(240, 240)">
    <polygon points="0,-30 40,-10 0,10 -40,-10" fill="#34d399" opacity="0.9" />
    <polygon points="-40,-10 0,10 0,50 -40,30" fill="#059669" opacity="0.95" />
    <polygon points="0,10 40,-10 40,30 0,50" fill="#047857" />
  </g>

  <!-- Neural Net Constellation on Right -->
  <g transform="translate(950, 200)" opacity="0.85">
    <line x1="-120" y1="-80" x2="-40" y2="-20" stroke="#38bdf8" stroke-width="2" />
    <line x1="-120" y1="40" x2="-40" y2="-20" stroke="#38bdf8" stroke-width="2" />
    <line x1="-40" y1="-20" x2="60" y2="-60" stroke="#38bdf8" stroke-width="2" />
    <line x1="-40" y1="-20" x2="70" y2="30" stroke="#34d399" stroke-width="2" />
    <line x1="60" y1="-60" x2="140" y2="-10" stroke="#38bdf8" stroke-width="2" />
    <line x1="70" y1="30" x2="140" y2="-10" stroke="#34d399" stroke-width="2" />
    <line x1="70" y1="30" x2="110" y2="90" stroke="#a78bfa" stroke-width="2" />
    <line x1="-120" y1="40" x2="-20" y2="80" stroke="#a78bfa" stroke-width="2" />
    <line x1="-20" y1="80" x2="70" y2="30" stroke="#a78bfa" stroke-width="2" />

    <circle cx="-120" cy="-80" r="7" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="-120" cy="40" r="8" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="-40" cy="-20" r="10" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="60" cy="-60" r="7" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="70" cy="30" r="11" fill="#34d399" filter="url(#glow)" />
    <circle cx="140" cy="-10" r="9" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="-20" cy="80" r="7" fill="#a78bfa" filter="url(#glow)" />
    <circle cx="110" cy="90" r="7" fill="#a78bfa" filter="url(#glow)" />
  </g>

  <!-- Typography -->
  <text x="360" y="180" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="76" fill="url(#cyanGlow)" letter-spacing="4" filter="url(#glow)">VOXEL AI</text>
  <text x="360" y="225" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="700" font-size="20" fill="#94a3b8" letter-spacing="3">AUTONOMOUS VOXEL SIMULATION &amp; NEUROEVOLUTION ENGINE</text>

  <rect x="360" y="250" width="135" height="32" rx="6" fill="#0284c7" opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
  <text x="375" y="271" font-family="'Segoe UI', monospace" font-size="13" font-weight="bold" fill="#38bdf8">.NET 4.0 / C#</text>

  <rect x="505" y="250" width="145" height="32" rx="6" fill="#047857" opacity="0.3" stroke="#34d399" stroke-width="1.5" />
  <text x="520" y="271" font-family="'Segoe UI', monospace" font-size="13" font-weight="bold" fill="#34d399">Win32 OpenGL</text>

  <rect x="660" y="250" width="155" height="32" rx="6" fill="#7c3aed" opacity="0.3" stroke="#a78bfa" stroke-width="1.5" />
  <text x="675" y="271" font-family="'Segoe UI', monospace" font-size="13" font-weight="bold" fill="#c4b5fd">Q-Learning + GA</text>

  <text x="360" y="325" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#64748b">Infinite procedural terrain • 12-trait genetic code • Tabular reinforcement policy • 0-dependency native binary</text>
</svg>
