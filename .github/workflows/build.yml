name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Compile VoxelAI (Windows x86)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with .NET Framework csc.exe
        shell: cmd
        run: |
          call build.bat
          if errorlevel 1 exit /b 1

      - name: Verify binary
        shell: pwsh
        run: |
          $exe = "bin/Release/VoxelAI.exe"
          if (!(Test-Path $exe)) { Write-Error "Build output missing: $exe"; exit 1 }
          $info = Get-Item $exe
          Write-Host "Built $exe ($($info.Length) bytes)"
          if ($info.Length -lt 50000) { Write-Error "Binary suspiciously small"; exit 1 }
          # Both copies must match (build.bat copies to repo root)
          $root = Get-Item "VoxelAI.exe"
          if ($root.Length -ne $info.Length) { Write-Error "Root VoxelAI.exe out of sync with bin/Release"; exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelAI-win-x86
          path: |
            bin/Release/VoxelAI.exe
            VoxelAI.exe
          if-no-files-found: error

      - name: Commit compiled binary back to branch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f VoxelAI.exe bin/Release/VoxelAI.exe
          if (git diff --cached --quiet) {
            Write-Host "Compiled binary unchanged - nothing to commit"
            exit 0
          }
          git commit -m "ci: refresh compiled VoxelAI.exe [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
